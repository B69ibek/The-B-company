<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Client Dashboard — The B Company</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand-row">
      <img src="/img/logo.svg" alt="">
      <span>The B Company</span>
    </div>
    <nav>
      <button class="nav-link active">My shipments</button>
    </nav>
    <div class="sidebar-foot">
      <div class="who" id="whoAmI"></div>
      <button class="btn btn-secondary" id="logoutBtn" style="background:transparent;color:var(--parchment);border-color:rgba(241,236,221,0.4);">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <h1>My shipments</h1>
    <p class="page-sub" id="companyLine"></p>
    <div class="panel"><div id="shipmentsTable"></div></div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/client-dashboard.js"></script>
</body>
</html>
